// ── Forest: branching firs, sunlit birches and thousands of grass blades ──────
const trunkMat=mat(0x574533);const pineMat=[mat(0x324f40),mat(0x3c5944),mat(0x47644b),mat(0x536e50)];
const foliageGeo=new THREE.ConeGeometry(1,1,9,1);const pineParts=[];const swayTrees=[];
function pine(x,z,h){const group=new THREE.Group();group.position.set(x,groundY(x,z),z);scene.add(group);cyl(.014*h,.022*h,h*.72,trunkMat,0,h*.36,0,8,group);for(let j=0;j<7;j++){const y=h*(.34+j*.085),r=h*(.245-j*.027);const p=mesh(foliageGeo,pineMat[j%4],0,y,0,group);p.scale.set(r,h*.31,r);p.rotation.y=rr(0,6.28);if(j<4){for(let k=0;k<5;k++){const a=k*Math.PI*.4+j;beam([0,y-h*.08,0],[Math.cos(a)*r*.9,y-h*.16,Math.sin(a)*r*.9],.007*h,trunkMat,group)}}}if(swayTrees.length<18)swayTrees.push({g:group,phase:rand()*6});}
// Clear sight lines preserve the house and the stream, while silhouettes frame them.
for(let i=0;i<62;i++){const z=rr(-39,-10),x=rr(-33,32);if(Math.abs(x-streamX(z))>2.8)pine(x,z,rr(6,12))}
for(const [x,z,h] of [[-12,2,11],[-10,-3,9],[-16,8,13],[-17,-7,12],[17,-2,12],[19,5,14],[14,-8,9],[24,12,13],[-24,15,14]])pine(x,z,h);
const birchBark=mat(0xa6a38a),birchLeaves=[mat(0x9f9d50),mat(0xb5a259),mat(0x7d8d4c)];
function birch(x,z,h){cyl(.12,.22,h,birchBark,x,h/2,z,8);for(let i=0;i<9;i++){const y=h*.45+i*.055*h,a=i*2.4,reach=rr(1.1,2.3);beam([x,y,z],[x+Math.cos(a)*reach,y+1.4,z+Math.sin(a)*reach],.07,birchBark);const crown=mesh(new THREE.IcosahedronGeometry(1,1),birchLeaves[i%3],x+Math.cos(a)*reach,y+1.55,z+Math.sin(a)*reach);crown.scale.set(rr(1.2,1.8),rr(.65,1.1),rr(1.1,1.7));}for(let i=0;i<13;i++)box(.23,.07,.025,trunkMat,x+.015,.4+i*h/14,z+.19)}birch(-7.4,-3.8,6.4);birch(13,-5.6,7.5);
// Efficient instanced tufts: 20,000 blades in a handful of draw calls.
const bladeGeo=new THREE.BufferGeometry();bladeGeo.setAttribute('position',new THREE.Float32BufferAttribute([-.045,0,0,.045,0,0,.015,.4,.045,0,.65,.1],3));bladeGeo.setIndex([0,1,2,0,2,3]);bladeGeo.computeVertexNormals();
const grassMat=new THREE.MeshStandardMaterial({color:0x87935a,roughness:1,side:THREE.DoubleSide});const grass=new THREE.InstancedMesh(bladeGeo,grassMat,22500);grass.receiveShadow=true;scene.add(grass);const dummy=new THREE.Object3D();let gi=0;
for(let i=0;i<7500;i++){const x=rr(-32,32),z=rr(-33,25),dist=Math.abs(x-streamX(z));if(dist<streamW(z)*.5+.24)continue;if(x>-5.2&&x<2.2&&z>-4.5&&z<3)continue;if(z>3&&z<14&&Math.abs(x-(-1.6-Math.sin((z-3.7)/.58*.21)*1.15))<.67)continue;const y=groundY(x,z);for(let j=0;j<3;j++){dummy.position.set(x+rr(-.12,.12),y,z+rr(-.12,.12));dummy.rotation.set(0,rr(0,6.28),rr(-.13,.13));const s=rr(.38,1);dummy.scale.set(s,s,s);dummy.updateMatrix();grass.setMatrixAt(gi,dummy.matrix);grass.setColorAt(gi,new THREE.Color().setHSL(rr(.18,.26),rr(.23,.4),rr(.23,.39)));gi++}}
grass.count=gi;grass.instanceMatrix.needsUpdate=true;
const fernGeo=new THREE.BufferGeometry();const fv=[],fi=[];for(let f=0;f<7;f++){const a=f*Math.PI*2/7;for(let k=1;k<9;k++){const t=k/9,r=t*.7,y=Math.sin(t*Math.PI*.85)*.55,w=Math.sin(t*Math.PI)*.19;const bx=Math.cos(a)*r,bz=Math.sin(a)*r;for(const s of [-1,1]){let p=fv.length/3;fv.push(bx,y,bz,bx+Math.cos(a+.9*s)*w,y+.025,bz+Math.sin(a+.9*s)*w,Math.cos(a)*(r+.12),Math.sin((t+.15)*Math.PI*.85)*.55,Math.sin(a)*(r+.12));fi.push(p,p+1,p+2)}}}fernGeo.setAttribute('position',new THREE.Float32BufferAttribute(fv,3));fernGeo.setIndex(fi);fernGeo.computeVertexNormals();const fernMat=new THREE.MeshStandardMaterial({color:0x668246,roughness:1,side:THREE.DoubleSide});for(let i=0;i<60;i++){let z=rr(-16,20),x=streamX(z)+(rand()<.5?-1:1)*rr(2.1,3.9);const m=mesh(fernGeo,fernMat,x,groundY(x,z),z);m.rotation.y=rand()*6.28;m.scale.setScalar(rr(.55,1.5));}
// A few meadow daisies catch the last light.
const flowerGeometry=new THREE.IcosahedronGeometry(.055,0),flowerInstance=new THREE.InstancedMesh(flowerGeometry,mat(0xd4c89b),210);scene.add(flowerInstance);for(let i=0;i<210;i++){let x=rr(-11,5),z=rr(4,18);dummy.position.set(x,groundY(x,z)+rr(.22,.5),z);dummy.rotation.set(0,rand()*6,0);dummy.scale.setScalar(rr(.7,1.2));dummy.updateMatrix();flowerInstance.setMatrixAt(i,dummy.matrix)}

// ── Quiet motion: chimney smoke, drifting motes and fireflies ────────────────
const smokeCanvas=document.createElement('canvas');smokeCanvas.width=smokeCanvas.height=128;const sc=smokeCanvas.getContext('2d'),gradient=sc.createRadialGradient(64,64,4,64,64,64);gradient.addColorStop(0,'rgba(225,222,198,.38)');gradient.addColorStop(.5,'rgba(222,220,204,.16)');gradient.addColorStop(1,'rgba(210,213,204,0)');sc.fillStyle=gradient;sc.fillRect(0,0,128,128);const smokeTex=new THREE.CanvasTexture(smokeCanvas);const smokes=[];for(let i=0;i<13;i++){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,color:0xd9dfce}));scene.add(m);smokes.push(m)}
const firePositions=new Float32Array(40*3),fireSeeds=[];for(let i=0;i<40;i++){fireSeeds.push({x:rr(-9,13),z:rr(-4,17),y:rr(.5,2.5),p:rand()*7});}
const fireGeo=new THREE.BufferGeometry();fireGeo.setAttribute('position',new THREE.BufferAttribute(firePositions,3));const fireMat=new THREE.PointsMaterial({color:0xffdc8a,size:.045,transparent:true,opacity:.72,blending:THREE.AdditiveBlending,depthWrite:false});scene.add(new THREE.Points(fireGeo,fireMat));

// Batch stationary geometry by material: the rich forest remains light on mobile.
// This local merger needs no addons or additional network dependencies.
scene.updateMatrixWorld(true);
const batches=new Map(),originalMeshes=[];
scene.traverse(o=>{
  if(!o.isMesh||o.isInstancedMesh||o.material.isShaderMaterial)return;
  const key=o.material.uuid+'-'+o.castShadow+'-'+o.receiveShadow;
  if(!batches.has(key))batches.set(key,{material:o.material,cast:o.castShadow,receive:o.receiveShadow,parts:[]});
  const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
  g.applyMatrix4(o.matrixWorld);batches.get(key).parts.push(g);originalMeshes.push(o);
});
for(const b of batches.values()){
  const count=b.parts.reduce((n,g)=>n+g.attributes.position.count,0),g=new THREE.BufferGeometry();
  for(const [name,size] of [['position',3],['normal',3],['uv',2],['color',3]]){
    if(name==='color'&&!b.material.vertexColors)continue;
    const a=new Float32Array(count*size);let offset=0;
    for(const part of b.parts){const attr=part.getAttribute(name);if(attr)a.set(attr.array,offset);offset+=part.attributes.position.count*size;}
    g.setAttribute(name,new THREE.BufferAttribute(a,size));
  }
  const m=new THREE.Mesh(g,b.material);m.castShadow=b.cast;m.receiveShadow=b.receive;scene.add(m);
  for(const part of b.parts)part.dispose();
}
for(const o of originalMeshes)o.removeFromParent();
swayTrees.length=0;

// ── Orbit only. No walking, keyboard movement or first-person controls. ──────
let azimuth=.57,elevation=.39,radius=27,targetRadius=27,targetAzimuth=.57,targetElevation=.39;const target=new THREE.Vector3(.1,2.1,.7);const activePointers=new Map();let pinchDistance=0;
const canvas=renderer.domElement;
function updateCamera(){const aspect=innerWidth/innerHeight,portrait=aspect<.8,dist=radius*(portrait?1.29:1);camera.position.set(target.x+Math.sin(azimuth)*Math.cos(elevation)*dist,target.y+Math.sin(elevation)*dist,target.z+Math.cos(azimuth)*Math.cos(elevation)*dist);camera.lookAt(target)}updateCamera();
canvas.addEventListener('pointerdown',e=>{activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);if(activePointers.size===2){const p=[...activePointers.values()];pinchDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});
canvas.addEventListener('pointermove',e=>{const old=activePointers.get(e.pointerId);if(!old)return;const dx=e.clientX-old.x,dy=e.clientY-old.y;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===1){targetAzimuth-=dx*.004;targetElevation=clamp(targetElevation+dy*.003,.12,1.15)}else if(activePointers.size===2){const p=[...activePointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinchDistance>0)targetRadius=clamp(targetRadius*pinchDistance/Math.max(d,1),13,45);pinchDistance=d}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>activePointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();targetRadius=clamp(targetRadius*Math.exp(e.deltaY*.001),13,45)},{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));updateCamera()});
let start=performance.now(),last=0;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animate(now){requestAnimationFrame(animate);if(document.hidden)return;const t=(now-start)/1000,dt=Math.min((now-last)/1000,.05);last=now;const easing=1-Math.exp(-dt*9);azimuth+=(targetAzimuth-azimuth)*easing;elevation+=(targetElevation-elevation)*easing;radius+=(targetRadius-radius)*easing;updateCamera();const motionT=reducedMotion?0:t;waterMat.uniforms.time.value=motionT;for(let i=0;i<smokes.length;i++){const age=(motionT*.18+i/smokes.length)%1;const s=smokes[i];s.position.set(.14+age*2.6+Math.sin(age*9+motionT*.2)*.15,7.5+age*5.3,-2.65+age*.9);s.scale.setScalar(.75+age*2.9);s.material.opacity=Math.sin(age*Math.PI)*.54;s.material.rotation=age*.7;}for(const {g,phase}of swayTrees)g.rotation.z=Math.sin(motionT*.4+phase)*.003;for(let i=0;i<40;i++){const p=fireSeeds[i];firePositions[i*3]=p.x+Math.sin(motionT*.2+p.p)*.45;firePositions[i*3+1]=p.y+Math.sin(motionT*.6+p.p)*.25;firePositions[i*3+2]=p.z+Math.cos(motionT*.25+p.p)*.4;}fireGeo.attributes.position.needsUpdate=true;warmLight.intensity=22+Math.sin(motionT*2.3)*.3;renderer.render(scene,camera)}
requestAnimationFrame(animate);renderer.render(scene,camera);const loading=document.getElementById('loading');loading.style.opacity='0';setTimeout(()=>loading.remove(),900);
